services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediashelf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediashelf_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mediashelf}
    volumes:
      - mediashelf-pgdata:/var/lib/postgresql/data
    networks:
      - mediashelf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediashelf}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://mediashelf:mediashelf_dev@db:5432/mediashelf}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mediashelf-net
    restart: unless-stopped

  # Optional in-stack LLM for recommendations, off by default. Normally
  # OLLAMA_URL points at a faster machine (e.g. a Mac running native Ollama).
  # Start this one only with: docker compose --profile local-llm up -d
  # CPU-only; capped so it can't starve the rest of the server. No published
  # port: only the api reaches it.
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:0.40.4
    volumes:
      - mediashelf-ollama:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    cpus: 2
    mem_limit: 6g  # 4g ran out once the 8K context was allocated
    networks:
      - mediashelf-net
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - mediashelf-net
    restart: unless-stopped

volumes:
  mediashelf-pgdata:
  mediashelf-ollama:

networks:
  mediashelf-net:
    driver: bridge
