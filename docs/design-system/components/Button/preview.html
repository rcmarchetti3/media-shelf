<div style="padding:20px;display:flex;flex-direction:column;gap:14px">

    <button class="ms-btn ms-btn--default">Add Items</button>
    <button class="ms-btn ms-btn--outline">Cancel</button>
    <button class="ms-btn ms-btn--secondary">Edit</button>
    <button class="ms-btn ms-btn--ghost">View all</button>
    <button class="ms-btn ms-btn--destructive">Remove</button>
    <button class="ms-btn ms-btn--link">Start searching</button>
  </div>
