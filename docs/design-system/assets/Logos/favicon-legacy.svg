<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Shelf base -->
  <rect x="3" y="24" width="26" height="2.5" rx="1" fill="#f97316"/>
  <!-- Left book -->
  <rect x="6" y="8" width="4" height="16" rx="1" fill="#f97316"/>
  <!-- Middle vinyl record -->
  <circle cx="16" cy="16" r="5.5" stroke="#f97316" stroke-width="2"/>
  <circle cx="16" cy="16" r="1.5" fill="#f97316"/>
  <!-- Right book -->
  <rect x="22" y="10" width="4" height="14" rx="1" fill="#f97316"/>
  <!-- Film strip accent on right book -->
  <rect x="23" y="11" width="2" height="1.5" rx="0.3" fill="white" opacity="0.5"/>
  <rect x="23" y="13.5" width="2" height="1.5" rx="0.3" fill="white" opacity="0.5"/>
</svg>
