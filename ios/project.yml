# XcodeGen project definition.
# Run `xcodegen generate` in this folder, then open MediaShelf.xcodeproj.
# The .xcodeproj is gitignored on purpose: this file is the source of truth.

name: MediaShelf

options:
  bundleIdPrefix: com.rcmarchetti
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Set this to your Apple Developer team ID once, or pick it in Xcode > Signing.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MediaShelf:
    type: application
    platform: iOS
    sources:
      - path: MediaShelf
    info:
      path: MediaShelf/Info.plist
      properties:
        CFBundleDisplayName: MediaShelf
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        # The server is self-hosted and usually reached over Tailscale or a LAN
        # address without TLS. This lets plain http through. If you front the
        # API with https (Cloudflare tunnel, tailscale cert), delete this block.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rcmarchetti.mediashelf
        SWIFT_EMIT_LOC_STRINGS: YES
