# XcodeGen project definition.
# Run `xcodegen generate` in this folder, then open MediaShelf.xcodeproj.
# The .xcodeproj is gitignored on purpose: this file is the source of truth.

name: MediaShelf

options:
  bundleIdPrefix: com.rcmarchetti
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Set this to your Apple Developer team ID once, or pick it in Xcode > Signing.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MediaShelf:
    type: application
    platform: iOS
    sources:
      - path: MediaShelf
    info:
      path: MediaShelf/Info.plist
      properties:
        CFBundleDisplayName: MediaShelf
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        # The server is self-hosted. Public hostnames (a Cloudflare tunnel) must
        # use https. Plain http is allowed only for local-network hosts: bare
        # names like rj-server, .local, and IP addresses. Anything else typed
        # as http://something.example.com is refused by the system, on purpose.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Shown the first time the app talks to a server on the home network.
        # Without it iOS can block LAN connections with no explanation.
        NSLocalNetworkUsageDescription: MediaShelf connects to your own MediaShelf server on your home network to load and save your collection.
        # Only standard HTTPS encryption, which is exempt. Stops App Store
        # Connect from asking the export-compliance question on every upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rcmarchetti.mediashelf
        SWIFT_EMIT_LOC_STRINGS: YES

  # Swift Testing. Hosted in the app so it can @testable import MediaShelf
  # and drive APIClient against MockServer. XcodeGen sets TEST_HOST and
  # BUNDLE_LOADER from the dependency.
  MediaShelfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MediaShelfTests
    dependencies:
      - target: MediaShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rcmarchetti.mediashelf.tests
        GENERATE_INFOPLIST_FILE: YES

  # XCUITest flows. Every test launches the app with --mock-server, so no
  # real backend is involved. XcodeGen sets TEST_TARGET_NAME from the dependency.
  MediaShelfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MediaShelfUITests
    dependencies:
      - target: MediaShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rcmarchetti.mediashelf.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MediaShelf:
    build:
      targets:
        MediaShelf: all
        MediaShelfTests: [test]
        MediaShelfUITests: [test]
    run:
      config: Debug
      # Tick these in Edit Scheme > Run > Arguments to run against the
      # in-process mock backend (account: tester / shelf-tester-2026).
      commandLineArguments:
        "--mock-server": false
        "--mock-signed-in": false
        "--mock-empty": false
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - MediaShelfTests
        - MediaShelfUITests
    profile:
      config: Release
    archive:
      config: Release
